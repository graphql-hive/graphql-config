name: CI

on:
  pull_request:
    branches: [master]
    paths-ignore: [website/**]
  push:
    branches: [master]
    paths-ignore: [website/**]

jobs:
  test:
    name: Node ${{matrix.node_version}} on ${{matrix.os}} (graphql ${{matrix.graphql_version}})
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node_version: [22, 24, 26]
        # 17 is the `graphql` devDependency; 16 is installed as the `graphql-16` npm alias and
        # selected with `--mode graphql-16` (see vitest.config.ts)
        graphql_version: [16, 17]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup env
        uses: the-guild-org/shared-config/setup@main
        with:
          packageManager: 'pnpm'
          nodeVersion: ${{matrix.node_version}}

      - name: Test
        run: pnpm run test:once --mode graphql-${{matrix.graphql_version}}

      - name: Build
        run: pnpm run build

      - name: Integrity check
        run: npx bob check

  lint:
    name: Lint
    uses: the-guild-org/shared-config/.github/workflows/lint.yml@main
    with:
      script: pnpm run ci:lint
      packageManager: 'pnpm'
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}

  prettier:
    name: Lint source files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Setup env
        uses: the-guild-org/shared-config/setup@main
        with:
          packageManager: 'pnpm'
          nodeVersion: 23

      - name: Lint Prettier
        run: pnpm run prettier:check
